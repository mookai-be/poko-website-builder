ctxCssImport: true
inlineAllStyles: true
fontStacksContexts:
  - name: main
    body:
      native: system-ui
      custom: Roboto Condensed
    heading:
      native: system-ui
      custom: Roboto Condensed
    code:
      native: monospace-code
customFontsImport:
  - name: Roboto Condensed
    source:
      type: fontsource
      name: Roboto Condensed
      weights:
        - '400'
        - '700'
      styles:
        - normal
        - italic
      subsets:
        - latin
typeScales:
  - name: main
    minFontSize: 18
    maxFontSize: 20
    minTypeScale: 1.2
    maxTypeScale: 1.25
colors:
  - name: bordeau
    value: '#741e16'
  - name: corail
    value: '#d34322'
  - name: sand
    value: '#a2724e'
  - name: gold
    value: '#e6941a'
  - name: purple
    value: '#8c8197'
  - name: black
    value: '#262626'
  - name: white
    value: '#ffffff'
styleContexts:
  - name: main
    value: ctx
