ctxCssImport: true
inlineAllStyles: true
widthsContexts:
  - name: main
    max: 80rem
    prose: 50rem
fontStacksContexts:
  - name: main
    body:
      native: system-ui
      custom: DM Sans
    heading:
      native: system-ui
      custom: DM Sans
    code:
      native: monospace-code
customFontsImport:
  - name: DM Sans
    source:
      type: fontsource
      name: DM Sans
      weights:
        - '400'
        - '700'
      styles:
        - normal
        - italic
      subsets:
        - latin
typeScales:
  - name: main
    minFontSize: 18
    maxFontSize: 20
    minTypeScale: 1.2
    maxTypeScale: 1.25
    customSteps:
      - startStep: '5'
        endStep: '8'
colors:
  - name: bordeau
    value: '#731E15'
  - name: red
    value: '#970711'
  - name: corail
    value: '#d34322'
  - name: mocha
    value: '#4B3934'
  - name: taupe-dark
    value: '#958075'
  - name: taupe
    value: '#CCA496'
  - name: peach
    value: '#FFCBB9'
  - name: purple
    value: '#8c8197'
  - name: gold
    value: '#D07F10'
  - name: black
    value: '#000000'
  - name: white
    value: '#ffffff'
palettes:
  - name: main
    read: peach
    tone: purple
    pop: mocha
    neutral: corail
  - name: mocha
    read: peach
    tone: taupe
    pop: corail
    neutral: mocha
  - name: purple
    read: mocha
    tone: taupe
    pop: peach
    neutral: purple
  - name: bordeau
    read: peach
    tone: taupe-dark
    pop: corail
    neutral: bordeau
  - name: gold
    read: bordeau
    tone: taupe-dark
    pop: corail
    neutral: gold
  - name: white
    read: purple
    tone: taupe-dark
    pop: bordeau
    neutral: white
  - name: red
    read: peach
    tone: taupe
    pop: purple
    neutral: red
styleContexts:
  - name: main
    value: ctx
